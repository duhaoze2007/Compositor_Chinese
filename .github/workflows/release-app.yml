name: 构建中文版

# 构建中文版 Compositor（Release），并把 .app 压缩包挂到 Release：
#   · 推送 main      → 更新预发布标签 zh-latest（最新构建）
#   · 推送 v* 标签   → 用 RELEASE_NOTES.md 建正式 Release，并附上 .app
# 构建失败时，xcodebuild 日志会作为该 Release 的资源一起上传，方便排查。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localized-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Release .app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 选择 Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: 解析 Swift 依赖（Sparkle）
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: 构建 Release
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee build.log | tail -200

      - name: 检查中文资源
        if: steps.build.outcome == 'success'
        run: |
          APP="DerivedData/Build/Products/Release/Compositor.app"
          test -d "$APP" || { echo "没有生成 $APP"; exit 1; }
          # 兜底：如果 Xcode 没有把 .lproj 打进包里（工程 knownRegions 之外的情况），就直接补进去
          if [ ! -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings" ]; then
            echo "构建产物里没有 zh-Hans.lproj，补入源码里的中文资源"
            mkdir -p "$APP/Contents/Resources/zh-Hans.lproj"
            cp Compositor/Resources/zh-Hans.lproj/*.strings "$APP/Contents/Resources/zh-Hans.lproj/"
          fi
          codesign --force --deep --sign - "$APP"
          ls -la "$APP/Contents/Resources" | tee -a build.log
          test -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings" || { echo "缺少 Localizable.strings"; exit 1; }
          test -f "$APP/Contents/Resources/zh-Hans.lproj/InfoPlist.strings" || { echo "缺少 InfoPlist.strings"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$APP/Contents/Info.plist"
          grep -c '";' "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"

      - name: 打包
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Compositor.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Compositor-${VERSION}-zh.${BUILD}.zip"
          ls -la *.zip

      - name: 发布
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # 正式版本：用仓库里的发布说明建 Release
            TAG="$GITHUB_REF_NAME"
            TITLE="Compositor 中文版 ${TAG#v}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
            else
              gh release create "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
            fi
          else
            # 日常构建：更新 zh-latest 预发布
            TAG=zh-latest
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --prerelease \
                --title "Compositor 中文版（自动构建）" \
                --notes "本标签下的 Compositor 中文版由 GitHub Actions 自动构建，每次推送 main 都会更新。正式说明见 RELEASE_NOTES.md。"
          fi
          if ls *.zip >/dev/null 2>&1; then
            gh release upload "$TAG" *.zip --clobber
          fi
          # 日志始终上传，方便核对打进去的中文资源
          gh release upload "$TAG" build.log --clobber || true
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "构建失败，日志已上传到 $TAG"
            exit 1
          fi

      - name: 保留构建产物（7 天）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-zh-app
          path: |
            *.zip
            build.log
          retention-days: 7
          if-no-files-found: warn
