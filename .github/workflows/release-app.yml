name: 构建中文版

# 构建中文版 Compositor，并把 .app 压缩包挂到 Release（标签 zh-latest，预发布），
# 供任何人直接下载安装：https://github.com/duhaoze2007/Compositor_Chinese/releases
on:
  push:
    branches: [main]
    paths:
      - 'Compositor/**'
      - 'Config/**'
      - 'Compositor.xcodeproj/**'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localized-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Release .app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 选择 Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: 解析 Swift 依赖（Sparkle）
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: 构建 Release
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Automatic
          DEVELOPMENT_TEAM=
          ONLY_ACTIVE_ARCH=YES

      - name: 检查中文资源
        run: |
          APP="DerivedData/Build/Products/Release/Compositor.app"
          test -d "$APP" || { echo "没有生成 $APP"; exit 1; }
          ls -la "$APP/Contents/Resources" | head -30
          test -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings" || { echo "缺少中文本地化资源"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$APP/Contents/Info.plist"

      - name: 压缩并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Compositor.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          NAME="Compositor-${VERSION}-zh.${BUILD}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$NAME"
          # 早于本工作流创建的 Release 不是这个流程的，别去改它
          gh release view zh-latest >/dev/null 2>&1 || \
            gh release create zh-latest --prerelease \
              --title "Compositor 中文版（最新构建）" \
              --notes "本标签下的 Compositor 中文版由 GitHub Actions 自动构建，每次推送 main 都会更新。正式说明见仓库根目录的 RELEASE_NOTES.md。"
          gh release upload zh-latest "$NAME" --clobber
          echo "已上传 $NAME"

      - name: 保留构建产物（7 天）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-zh-app
          path: '*.zip'
          retention-days: 7
          if-no-files-found: warn
