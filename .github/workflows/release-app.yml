name: 构建中文版

# 构建中文版 Compositor（Release），并把 .app 压缩包挂到 Release（标签 zh-latest，预发布），
# 任何人都能直接下载安装：https://github.com/duhaoze2007/Compositor_Chinese/releases
# 构建失败时，xcodebuild 日志会作为 zh-latest 的资源一起上传，方便排查。
on:
  push:
    branches: [main]
    paths:
      - 'Compositor/**'
      - 'Config/**'
      - 'Compositor.xcodeproj/**'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localized-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Release .app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 选择 Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: 解析 Swift 依赖（Sparkle）
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: 构建 Release
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee build.log | tail -200

      - name: 检查中文资源
        if: steps.build.outcome == 'success'
        run: |
          APP="DerivedData/Build/Products/Release/Compositor.app"
          test -d "$APP" || { echo "没有生成 $APP"; exit 1; }
          ls -la "$APP/Contents/Resources"
          test -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings" || { echo "缺少 Localizable.strings"; exit 1; }
          test -f "$APP/Contents/Resources/zh-Hans.lproj/InfoPlist.strings" || { echo "缺少 InfoPlist.strings"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$APP/Contents/Info.plist"
          grep -c '";' "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"

      - name: 打包
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Compositor.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Compositor-${VERSION}-zh.${BUILD}.zip"
          ls -la *.zip

      - name: 发布到 Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view zh-latest >/dev/null 2>&1 || \
            gh release create zh-latest --prerelease \
              --title "Compositor 中文版（自动构建）" \
              --notes "本标签下的 Compositor 中文版由 GitHub Actions 自动构建，每次推送 main 都会更新。说明见仓库根目录的 RELEASE_NOTES.md。"
          if ls *.zip >/dev/null 2>&1; then
            gh release upload zh-latest *.zip --clobber
          fi
          # 构建失败时也要能看到日志
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            gh release upload zh-latest build.log --clobber || true
            echo "构建失败，日志已上传"
            exit 1
          fi

      - name: 保留构建产物（7 天）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-zh-app
          path: |
            *.zip
            build.log
          retention-days: 7
          if-no-files-found: warn
